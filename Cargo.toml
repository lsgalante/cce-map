[package]
name = "cce-map"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "9f765b477abc15f813a68b4dfe9b8d34fd9f4997" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
reqwest = { version = "0.12", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
