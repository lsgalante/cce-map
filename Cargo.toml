[package]
name = "cce-map"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://git.lucas.co/cce-ui.git", rev = "769b31250d19fe5ef36a38adbebbaaebafd024fa" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
reqwest = { version = "0.12", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
