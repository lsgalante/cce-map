[package]
name = "cce-map"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "6bd1571a7dfe82e1c3a00d3e86795d6c17af14d6" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
reqwest = { version = "0.12", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
